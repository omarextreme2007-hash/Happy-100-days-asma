<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 days ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd6e2;--bg2:#fff0da;--pink:#f08fae;--pink2:#ffc6d6;--deep:#b0305a;--ink:#6e1a3d;--paper:#fff7fa;--btn:#fff;--shadow:rgba(176,48,90,.28);--gl:rgba(255,255,255,.38);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1020;--bg2:#3b1830;--pink:#a3446c;--pink2:#5c2744;--deep:#ff9fbd;--ink:#ffd9e5;--paper:#3a1a2e;--btn:#2a1020;--shadow:rgba(0,0,0,.45);--gl:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1020;--bg2:#3b1830;--pink:#a3446c;--pink2:#5c2744;--deep:#ff9fbd;--ink:#ffd9e5;--paper:#3a1a2e;--btn:#2a1020;--shadow:rgba(0,0,0,.45);--gl:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:22px;line-height:1.25;overflow-x:hidden}
.px{font-family:'Silkscreen','Courier New',monospace}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx i{position:absolute;bottom:-30px;color:var(--deep);opacity:.55;font-style:normal;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx,0));opacity:0}}
main{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:28px 16px 60px}
.stage{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.win{width:100%;max-width:340px;border:3px solid var(--pink);border-radius:10px;background:var(--paper);box-shadow:0 14px 34px var(--shadow);overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--pink2);border-bottom:3px solid var(--pink);font-size:12px;letter-spacing:.08em}
.bar b{display:flex;gap:4px}
.bar b s{width:14px;height:14px;border:2px solid var(--pink);background:var(--paper);display:block}
.sub{text-align:center;padding:5px;background:var(--pink2);border-bottom:3px solid var(--pink);color:var(--deep);letter-spacing:.4em;font-size:14px}
.body{padding:20px 16px 16px;text-align:center;background-color:var(--pink2);background-image:linear-gradient(90deg,var(--gl) 50%,transparent 50%),linear-gradient(var(--gl) 50%,transparent 50%);background-size:22px 22px}
.msg{font-size:15px;line-height:1.5;color:var(--ink);margin:0 0 14px}
#cat{width:200px;height:auto;display:block;margin:0 auto 10px;image-rendering:pixelated}
.won #cat{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
.row{position:relative;height:104px;margin-top:6px}
.row button{position:absolute;font-family:'Silkscreen','Courier New',monospace;color:var(--ink);background:var(--btn);border:3px solid var(--pink);border-radius:6px;box-shadow:0 4px 0 var(--pink);cursor:pointer;transition:transform .25s ease,left .25s ease,top .25s ease}
#yes{left:14%;top:10px;padding:12px 22px;font-size:16px;font-weight:700}
#no{left:62%;top:20px;padding:8px 12px;font-size:11px}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink)}
button:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.hint{margin-top:18px;font-size:12px;color:var(--deep);opacity:0;pointer-events:none}
.won .hint{animation:hintpulse 1.6s ease infinite}
@keyframes hintpulse{0%,100%{opacity:.55}50%{opacity:.95}}
.after{display:none}
.won .after{display:block}
.won .row,.won .ask{display:none}
section{margin-top:40px}
h2{font-size:16px;margin:0 0 12px;color:var(--deep);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid i{aspect-ratio:1;background:var(--pink2);border:2px solid var(--pink);border-radius:3px;display:block;transition:background .2s,transform .2s}
.grid i.on{background:var(--deep);border-color:var(--deep);transform:scale(1.04)}
.cap{font-size:20px;margin:10px 0 0}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px dashed var(--pink)}
.tl li{position:relative;margin:0 0 16px;padding-left:14px}
.tl li::before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;background:var(--deep);border:2px solid var(--paper)}
.tl .px{display:block;font-size:12px;color:var(--deep);margin-bottom:2px}
.letter{background:var(--paper);border:3px solid var(--pink);border-radius:10px;padding:18px;box-shadow:0 8px 0 var(--pink2)}
.letter p{margin:0 0 12px;font-size:23px}
.letter p:last-child{margin:0;text-align:right;color:var(--deep)}
@media (prefers-reduced-motion:reduce){.fx i,.won #cat,.won .hint{animation:none}.fx{display:none}.won .hint{opacity:.8}}

.nextwrap{margin-top:34px;text-align:center}
.pbtn{font-family:'Silkscreen','Courier New',monospace;font-size:13px;color:var(--ink);background:var(--btn);border:3px solid var(--pink);border-radius:6px;box-shadow:0 4px 0 var(--pink);padding:12px 18px;cursor:pointer}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink)}
.p2{position:relative;z-index:1;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 70px;max-width:1100px;margin:0 auto}
.p2[hidden]{display:none}
.p2 h1{font-size:15px;color:var(--deep);margin:22px 0 6px;text-align:center}
.p2 .lead{text-align:center;margin:0 0 26px;font-size:21px}
.board{position:relative;width:100%}
/* Polaroid & Arrow Layout */
.it{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center}
.caption-group{display:flex;flex-direction:column;align-items:center;margin-bottom:4px;z-index:80}
.note{position:relative;font-family:'Caveat','Comic Sans MS',cursive;font-weight:600;font-size:23px;line-height:1.1;color:var(--ink);padding:2px 8px;text-align:center;max-width:280px;transform:rotate(var(--nr))}
.arr{position:relative;width:38px;height:38px;fill:none;stroke:var(--deep);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-top:-2px}
.it.rt .arr{transform:scaleX(-1)}
.it.rt .note{text-align:right}

.pol{position:relative;z-index:var(--z);background:#fff;padding:10px 10px 14px;box-shadow:0 7px 18px rgba(60,10,30,.25);transform:rotate(var(--r));transition:transform .2s;border-radius:2px;width:100%}
.pol.has-inside{padding-bottom:12px}
.pol img{display:block;width:100%;height:auto;background:#eee;border-radius:1px}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:62px;height:20px;margin-left:-31px;background:rgba(255,226,140,.8);transform:rotate(var(--tr));opacity:var(--tp)}
.pol:hover{transform:rotate(var(--r)) scale(1.03)}

.pol-cap{font-family:'Caveat','Comic Sans MS',cursive;font-weight:600;font-size:22px;line-height:1.15;color:#4a1228;text-align:center;margin-top:10px;padding:0 4px}

.lb{position:fixed;inset:0;z-index:100;background:rgba(30,6,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer}
.lb[hidden]{display:none}
.lb img{max-width:92vw;max-height:72vh;background:#fff;padding:9px;border-radius:2px}
.lb p{font-family:'Caveat','Comic Sans MS',cursive;font-size:30px;color:#fff;text-align:center;margin:14px 0 0;max-width:600px}
.lb small{font-family:'Silkscreen',monospace;font-size:10px;color:#ffd0df;margin-top:10px;opacity:.8}
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<main id="main">
  <div class="stage">
    <div class="win" role="group" aria-label="A question for Asma">
      <div class="bar px"><span>LOVE.EXE</span><b><s></s><s></s><s></s></b></div>
      <div class="sub">♥ · ♥ · ♥</div>
      <div class="body">
        <p class="msg px" id="msg"></p>
        <svg id="cat" viewBox="0 0 32 23" shape-rendering="crispEdges" aria-hidden="true"></svg>
        <div class="row ask" id="row">
          <button id="yes" type="button">YES</button>
          <button id="no" type="button">NO</button>
        </div>
      </div>
    </div>
    <p class="hint px">scroll down ↓</p>
  </div>

  <div class="after" id="after">
    <section>
      <h2 class="px">100 days, filled in</h2>
      <div class="grid" id="grid" aria-label="100 hearts"></div>
      <p class="cap" id="cap"></p>
    </section>
    <section>
      <h2 class="px">Our days</h2>
      <ul class="tl" id="tl"></ul>
    </section>
    <section>
      <h2 class="px">For you</h2>
      <div class="letter" id="letter"></div>
      <div class="nextwrap"><button class="pbtn" id="next" type="button">see the gallery ♥</button></div>
    </section>
  </div>
</main>
<div class="p2" id="p2" hidden>
  <button class="pbtn" id="back" type="button">back</button>
  <h1 class="px">100 days, in pictures</h1>
  <p class="lead">Tap any picture to see it up close.</p>
  <div class="board" id="board"></div>
</div>

// Floating hearts
function spawn(){
  var h = document.createElement('i');
  h.textContent = '♥';
  h.style.left = Math.random()*100 + '%';
  h.style.fontSize = (10 + Math.random()*16) + 'px';
  h.style.setProperty('--dx', (Math.random()*60-30) + 'px');
  var d = 7 + Math.random()*6;
  h.style.animationDuration = d + 's';
  $('fx').appendChild(h);
  setTimeout(function(){ h.remove(); }, d*1000);
}
setInterval(spawn, 700);

// The NO button runs away
var tries = 0, row = $('row'), no = $('no'), yes = $('yes');
var lines = ['NO','no?','really?','nope','try again','🙃','no.'];
function dodge(e){
  if (e) e.preventDefault();
  tries++;
  var r = row.getBoundingClientRect();
  var x = Math.random()*Math.max(10, r.width - no.offsetWidth);
  var y = Math.random()*Math.max(10, r.height - no.offsetHeight);
  no.style.left = x + 'px';
  no.style.top = y + 'px';
  no.style.transform = 'scale(' + Math.max(.55, 1 - tries*.07) + ')';
  yes.style.transform = 'scale(' + Math.min(1.45, 1 + tries*.06) + ')';
  no.textContent = lines[Math.min(tries, lines.length-1)];
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('pointerdown', dodge);
no.addEventListener('click', function(e){ e.preventDefault(); });

// YES
yes.addEventListener('click', function(){
  document.body.classList.add('won');
  $('main').classList.add('won');
  $('msg').textContent = CONFIG.yesLine;
  for (var i=0;i<24;i++) setTimeout(spawn, i*60);
  // timeline
  $('tl').innerHTML = CONFIG.milestones.map(function(m){
    return '<li><span class="px"></span>'+'</li>';
  }).join('');
  var items = $('tl').children;
  CONFIG.milestones.forEach(function(m,i){
    items[i].querySelector('.px').textContent = m[0];
    items[i].appendChild(document.createTextNode(m[1]));
  });
  // letter
  $('letter').innerHTML = '';
  CONFIG.letter.forEach(function(t){
    var p = document.createElement('p'); p.textContent = t; $('letter').appendChild(p);
  });
  // 100 hearts fill in
  var g = $('grid'); g.innerHTML = '';
  for (var n=0;n<100;n++){ g.appendChild(document.createElement('i')); }
  Array.prototype.forEach.call(g.children, function(el,n){ setTimeout(function(){ el.classList.add('on'); }, 900 + n*30); });
});

  html+='<div class="pol'+(inside?' has-inside':'')+'"><img>'+(inside?'<div class="pol-cap"></div>':'')+'</div>';
  item.innerHTML=html;
  var n=item.querySelector('.note'); if(n) n.textContent=photo.c;
  var cap=item.querySelector('.pol-cap'); if(cap) cap.textContent=photo.c;
  var img=item.querySelector('img'); img.src=photo.s; img.width=photo.w; img.height=photo.h; img.alt=photo.c;
  item.addEventListener('click',function(){ $('lbi').src=photo.s; $('lbi').alt=photo.c; $('lbc').textContent=photo.c; lb.hidden=false; });
  board.appendChild(item); items.push(item);
});
lb.addEventListener('click',function(){ lb.hidden=true; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') lb.hidden=true; });

function layout(){
  if(p2.hidden) return;
  var W=board.clientWidth, mob=window.innerWidth<640, cols=mob?1:2;
  var colW=mob?Math.min(310,W-4):340, gapX=mob?0:50, gapY=40;
  var startX=Math.max(mob?0:10,(W-(cols*colW+(cols-1)*gapX))/2), hs=[];
  for(var k=0;k<cols;k++) hs.push(20);
  items.forEach(function(it){
    it.style.width=colW+'px';
    var c=0; for(var j=1;j<cols;j++) if(hs[j]<hs[c]) c=j;
    it.style.left=(startX+c*(colW+gapX))+'px';
    it.style.top=hs[c]+'px';
    hs[c]+=it.offsetHeight+gapY;
  });
  board.style.height=(Math.max.apply(null,hs)+40)+'px';
}
$('next').addEventListener('click',function(){ mainEl.hidden=true; p2.hidden=false; window.scrollTo(0,0); layout(); setTimeout(layout,250); });
$('back').addEventListener('click',function(){ p2.hidden=true; mainEl.hidden=false; window.scrollTo(0,0); });
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
